---
# Runs the role's preflight tasks once with the settings in `item.vars` and
# asserts it fails with a message containing `item.expect`.
- name: Preflight case | run preflight with invalid settings
  block:
    - name: Preflight case | include role preflight
      ansible.builtin.include_role:
        name: realtime.grafana_docker
        tasks_from: preflight.yml
      vars:
        grafana_docker_project_name: "{{ item.vars.grafana_docker_project_name | default('grafana') }}"
        grafana_docker_publish_address: "{{ item.vars.grafana_docker_publish_address | default('127.0.0.1') }}"
        grafana_docker_publish_port: "{{ item.vars.grafana_docker_publish_port | default(3000) }}"
        grafana_docker_networks: "{{ item.vars.grafana_docker_networks | default(['grafana_backend']) }}"
        grafana_docker_manage_networks: "{{ item.vars.grafana_docker_manage_networks | default(true) }}"
        grafana_docker_env_secrets: "{{ item.vars.grafana_docker_env_secrets | default({}) }}"
        grafana_docker_datasources: "{{ item.vars.grafana_docker_datasources | default([]) }}"
        grafana_docker_dashboards_version: "{{ item.vars.grafana_docker_dashboards_version | default('') }}"
        grafana_docker_dashboards_repo: "{{ item.vars.grafana_docker_dashboards_repo | default('git@github.com:COMAP-Math/grafana.dmz.comap.com.git') }}"
        grafana_docker_dashboards_folder: "{{ item.vars.grafana_docker_dashboards_folder | default('COMAP') }}"
        grafana_docker_dashboards_checksums: "{{ item.vars.grafana_docker_dashboards_checksums | default({}) }}"

    - name: Preflight case | fail if preflight unexpectedly passed
      ansible.builtin.fail:
        msg: "preflight passed but should have failed: {{ item.name }}"
  rescue:
    - name: Preflight case | collect the failure text
      ansible.builtin.set_fact:
        _preflight_failure_text: >-
          {{ ansible_failed_result.msg | default('') }}
          {{ ansible_failed_result.results | default([]) | map(attribute='msg', default='') | join(' ') }}

    - name: Preflight case | assert the expected failure message
      ansible.builtin.assert:
        that:
          - item.expect in _preflight_failure_text
        fail_msg: "'{{ item.name }}' failed, but not with '{{ item.expect }}': {{ _preflight_failure_text }}"
        quiet: true
