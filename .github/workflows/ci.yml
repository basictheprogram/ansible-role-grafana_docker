---
name: CI

"on":
  push:
    branches:
      - ansible-core-2.20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The role is checked out into a directory named after its role name, so
# `include_role: realtime.grafana_docker` resolves through ANSIBLE_ROLES_PATH.
defaults:
  run:
    working-directory: realtime.grafana_docker

env:
  ANSIBLE_ROLES_PATH: ${{ github.workspace }}

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          path: realtime.grafana_docker

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: realtime.grafana_docker/molecule/requirements.txt

      - name: Install lint tools
        run: pip install pre-commit "ansible-core>=2.20,<2.21" ansible-lint

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('realtime.grafana_docker/.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Run pre-commit
        run: pre-commit run --all-files

  # One job per supported OS release. The platform names are the ones in
  # molecule/default/molecule.yml. Grafana itself is never started: the Docker
  # tasks are tagged molecule-notest, so molecule checks the rendered files and
  # the preflight failures.
  molecule:
    name: Molecule ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - debian13
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          path: realtime.grafana_docker

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: realtime.grafana_docker/molecule/requirements.txt

      - name: Install Ansible and molecule
        run: pip install -r molecule/requirements.txt "ansible-core>=2.20,<2.21"

      # ansible-core alone does not ship community.docker, which drives the
      # molecule containers and which the role's own tasks use.
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run molecule test
        run: molecule test --platform-name ${{ matrix.platform }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_DEPRECATION_WARNINGS: "0"
          # molecule-plugins' create.yml has a non-boolean `when:`, which
          # ansible-core 2.19+ rejects unless this is set.
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "true"
